[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "open-pit-snap"
version = "0.1.0"
description = "Notebook-faithful SNAP/SAFE open-pit activity pipeline (CLI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "shapely>=2",
    "pyproj>=3.5",
    "PyYAML>=6",
    "matplotlib>=3.7",
            "asf_search>=8",
            "earthengine-api>=1,<2",
            "geemap>=0.30",
            "filelock>=3.12",
        ]

[project.optional-dependencies]
# esa_snappy comes from a SNAP install, not PyPI.
nisar = [
    "h5py>=3.8",
    "fsspec>=2023.1",
    "aiohttp>=3.8",
    "opera-utils[nisar]>=0.25.9,<0.26",
    "rioxarray>=0.15",
    "xarray>=2024.7",
    "geopandas>=1.0",
]

[project.scripts]
open-pit-snap = "open_pit_snap.cli:main"

[tool.setuptools.packages.find]
include = ["open_pit_snap*"]
